@switch (view()) {
  @case ('home') { <app-landing-page [isLoggedIn]="isLoggedIn()" (loginRequested)="openLogin()" (registerRequested)="openRegister()" (logoutRequested)="logout()" /> }
  @case ('login') { <app-auth-page mode="login" (modeChange)="view.set($event)" (authenticated)="completeLogin()" (homeRequested)="openHome()" (adminRequested)="openAdmin()" /> }
  @case ('register') { <app-auth-page mode="register" (modeChange)="view.set($event)" (authenticated)="completeLogin()" (homeRequested)="openHome()" (adminRequested)="openAdmin()" /> }
  @case ('admin') { <app-admin-page (homeRequested)="openHome()" (logoutRequested)="logout()" /> }
}
<router-outlet />
